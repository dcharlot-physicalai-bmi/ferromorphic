# Scientific verification. contents: read checks out the tree.
# actions/upload-artifact@v7 (cf430e030ddbb5b0abf93d22962f4752f3646cd9) does not
# document a GITHUB_TOKEN `actions: write` requirement. The workflow-syntax
# permission table's example of `actions: write` is cancelling a workflow run.
# Artifact bytes are uploaded by the action's own runtime token flow under the
# job's default contents scope, so this workflow does not grant `actions: write`.
name: verify

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-gates:
    name: nine release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust 1.100.0 from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt, rust-docs
      - name: zsh for tools/gates.sh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Run the nine gates
        run: zsh tools/gates.sh
      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gates-log
          path: target/gates.log
          if-no-files-found: error

  scientific:
    name: manifest, mutations, references
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust 1.100.0 from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt, rust-docs
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: C toolchain for PySpike
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential
      - name: Pinned reference interpreters
        run: python -m pip install -r tools/reference/requirements.txt
      - name: Scientific manifest
        env:
          FERROMORPHIC_PYTHON: python
          RUSTUP_TOOLCHAIN: "1.100.0"
        run: python tools/scientific_verify.py
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-report
          path: target/verification
          if-no-files-found: error
